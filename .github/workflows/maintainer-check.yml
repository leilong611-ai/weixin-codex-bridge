name: maintainer-check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  maintainer-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify doctor output shape
        run: |
          report="${{ runner.temp }}/doctor.json"
          npm run doctor --silent > "$report" || test "$?" -eq 1
          node -e 'const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!Array.isArray(report.checks) || typeof report.ok !== "boolean") process.exit(1)' "$report"

      - name: Verify CLI help
        run: node dist/cli.js help

      - name: Verify maintainer docs exist
        run: |
          test -f README.md
          test -f README.en.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CHANGELOG.md
