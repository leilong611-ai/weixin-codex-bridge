name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/cli.js exists
        run: node -e "require('fs').accessSync('dist/cli.js'); console.log('dist/cli.js exists')"

      - name: Test
        run: npm test -- --run

      - name: Public repository check
        shell: bash
        run: npm run public-check

      - name: Verify npm pack contents
        shell: bash
        run: |
          pack_root=$(cygpath -u "${{ runner.temp }}")
          mkdir -p "$pack_root/npm-pack"
          npm pack --pack-destination "$pack_root/npm-pack"
          tarball=$(ls "$pack_root/npm-pack"/*.tgz)
          mkdir -p "$pack_root/pack-check"
          tar -xzf "$tarball" -C "$pack_root/pack-check"
          echo "=== Pack contents ==="
          find "$pack_root/pack-check" -type f | sort
          echo "=== Validation ==="
          failures=0
          if [ ! -f "$pack_root/pack-check/package/dist/cli.js" ]; then
            echo "ERROR: dist/cli.js not in pack"
            failures=1
          else
            echo "✓ dist/cli.js"
          fi
          if [ -f "$pack_root/pack-check/package/.env" ]; then
            echo "ERROR: .env found in pack"
            failures=1
          else
            echo "✓ no .env"
          fi
          if [ -f "$pack_root/pack-check/package/bridge.db" ]; then
            echo "ERROR: bridge.db in pack"
            failures=1
          else
            echo "✓ no bridge.db"
          fi
          if [ -f "$pack_root/pack-check/package/README.md" ]; then
            echo "✓ README.md"
          fi
          if [ -f "$pack_root/pack-check/package/README.en.md" ]; then
            echo "✓ README.en.md"
          fi
          if [ -f "$pack_root/pack-check/package/LICENSE" ]; then
            echo "✓ LICENSE"
          fi
          if [ -f "$pack_root/pack-check/package/SECURITY.md" ]; then
            echo "✓ SECURITY.md"
          fi
          exit $failures

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate CLI-only preflight
        run: npm run validate:cli-only

      - name: Test
        run: npm test -- --run

      - name: Public repository check
        run: npm run public-check

      - name: Verify npm pack contents
        run: |
          mkdir -p "${{ runner.temp }}/npm-pack"
          npm pack --pack-destination "${{ runner.temp }}/npm-pack"
          tarball=$(ls "${{ runner.temp }}/npm-pack"/*.tgz)
          mkdir -p "${{ runner.temp }}/pack-check"
          tar -xzf "$tarball" -C "${{ runner.temp }}/pack-check"
          echo "=== Pack contents ==="
          find "${{ runner.temp }}/pack-check" -type f | sort
          echo "=== Validation ==="
          failures=0
          if [ ! -f "${{ runner.temp }}/pack-check/package/dist/cli.js" ]; then
            echo "ERROR: dist/cli.js not in pack"
            failures=1
          else
            echo "✓ dist/cli.js"
          fi
          if [ -f "${{ runner.temp }}/pack-check/package/.env" ]; then
            echo "ERROR: .env found in pack"
            failures=1
          else
            echo "✓ no .env"
          fi
          exit $failures
