name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist/cli.js exists
        run: node -e "require('fs').accessSync('dist/cli.js'); console.log('dist/cli.js exists')"

      - name: Test
        run: npm test -- --run

      - name: Public repository check
        shell: bash
        run: npm run public-check

      - name: Verify npm pack contents
        run: npm run pack:verify

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate CLI-only preflight
        run: npm run validate:cli-only

      - name: Test
        run: npm test -- --run

      - name: Public repository check
        run: npm run public-check

      - name: Verify npm pack contents
        run: npm run pack:verify
